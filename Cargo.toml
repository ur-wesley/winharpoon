[package]
name = "winharpoon"
version = "1.1.2"
edition = "2021"
description = "Harpoon-style window switcher for Windows"
license = "MIT"

[dependencies]
directories = "6"
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.34"
egui_material_icons = { version = "0.6", features = ["outline"] }
image = { version = "0.25", default-features = false, features = ["ico"] }
nucleo-matcher = "0.3"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
toml = "0.8.23"
tray-icon = "0.24"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }
winrt-toast-reborn = "0.3.8"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["ico"] }
winres = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
# Win32 requires unsafe; keep explicit but not denied.
missing_debug_implementations = "deny"
missing_docs = "allow"
unsafe_code = "allow"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Noise allowances: Win32 ABI + custom string logger.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
borrow_as_ptr = "allow"
ref_as_ptr = "allow"
ptr_as_ptr = "allow"
ptr_cast_constness = "allow"
struct_excessive_bools = "allow"
suboptimal_flops = "allow"
significant_drop_tightening = "allow"
missing_const_for_fn = "allow"
too_many_lines = "allow"
used_underscore_items = "allow"
