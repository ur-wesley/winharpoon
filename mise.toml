[tools]
rust = "1.96.0"
lefthook = "latest"

[tasks.build]
description = "Build debug binary"
run = "cargo build"

[tasks."build:release"]
description = "Build release binary"
run = "cargo build --release"

[tasks.check]
description = "Type-check without producing a binary"
run = "cargo check"

[tasks.clippy]
description = "Strict Clippy (deny pedantic+nursery)"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.test]
description = "Run unit tests"
run = "cargo test"

[tasks.loc]
description = "Line-count gate (ESLint max-lines style, 600 lines per file)"
run = "cargo test --test max_lines"

[tasks.audit]
description = "Supply-chain audit (cargo-audit, best-effort if installed)"
run = "cargo audit || echo 'cargo-audit not installed (cargo install cargo-audit)'"

[tasks.verify]
description = "Full gate: check + clippy + tests"
run = "cargo check && cargo clippy --all-targets -- -D warnings && cargo test"

[tasks.setup]
description = "Install git hooks (lefthook)"
run = "lefthook install"

[tasks.dev]
run = "cargo watch -x run"
